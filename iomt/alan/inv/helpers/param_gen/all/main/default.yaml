defaults:
- hydra: default
- _self_

device: "cuda:0"
nt: 1000
dt: 0.004
grid_spacing: [10.0, 10.0]
nx: 50
ny: 50
vp: 1500.0
src_loc: [[[25, 25]]]
rec_locs:
  method: cartesian
  fixed_y: 2
  x_stride: 5

ground_truth:
  mu: [25.0, 25.0]
  sig: [0.1, 0.1]
  peak_time: 0.2
  freq: 25.0
  scale: 1.0

init:
  mu: [20.0, 20.0]
  sig: [5.0, 5.0]
  peak_time: 0.23
  freq: 23.0
  scale: 2.0

optim:
  name: Adam
  params:
    lr: 0.01

loss:
  abs_loss_tol: 1e-8

alphas: [1.0]
gamma: 0.1

training:
  num_epochs: 1000
  history_freq: 10

dupe: 
  - out.txt
  - ${oc.env:PWD}/latest_run.txt