# cfg.yaml
# @VS@ cd /home/tyler/Documents/repos/Experiments/iomt/alan/inv2 && python -W ignore nelder_mead.py

ny: 250
nx: 250
nt: 4000
dx: 32.0
dy: 32.0
dt: 0.004

vel: 1500.0

n_shots: 1

freq: 2.5
peak_time_factor: 2.5

n_epochs: 100
lr: 0.1

editor: null
device: 'cuda:0'

ref_loc: [0.5, 0.5]
init_loc: [0.6, 0.6]

pml_width: 20
pml_freq: ${freq}

b: 4.0
hw: 70
beta:
  - ${b}
  - ${b}
halfwidth:
  - ${hw}
  - ${hw}

dupe: False
trainable: true

hydra:
  run:
    dir: .simple/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: .simple/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
