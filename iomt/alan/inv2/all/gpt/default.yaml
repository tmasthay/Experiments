#
# @VS@ cd _dir/../.. && python gpt.py

# Grid and geometry settings
grid:
  nx: 500
  ny: 500
  dy: 10.0
  dx: 10.0
  spacing: 
    - ${grid.dy}
    - ${grid.dx}

# Simulation parameters
simulation:
  dt: 0.001            # Time step (seconds)
  nt: 1000             # Number of time steps
  pml_freq: 25.0       # Frequency for absorbing boundaries (PML)

# Source settings
source:
  freq: ${simulation.pml_freq}          # Source wavelet frequency (Hz)
  peak_time: 0.04      # Peak time (s)
  mu_x: 25.0           # Initial guess for Gaussian mean in x
  mu_y: 25.0           # Initial guess for Gaussian mean in y
  sigma_x: 1.0         # Initial guess for Gaussian sigma_x
  sigma_y: 1.0         # Initial guess for Gaussian sigma_y

num_sources: all        # Number of sources to activate

# Velocity model settings (constant or file path)
velocity: 1500

# Receiver geometry (list of [x, y] pairs)
receivers:
  locations:
    - ["${grid.dy}", 0.02, 0.02, 1]
    - ["${grid.dx}", 0.1, 0.9, 100]

# Observed data placeholder (should be replaced with real data)
data:
  observed: null       # e.g., "./observed_data.pt"

# Optimization settings
optim:
  maxiter: 2000         # Maximum number of iterations

# Device settings
device: cuda:0

_tmp_:
  peak_time_factor: 1.0
  init_loc: [0.5, 0.9]
  ref_loc: [0.5, 0.5]
