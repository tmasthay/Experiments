defaults:
  - _self_

import_specs:
  delim: "@"
  key: "__import__"
  ignore_spaces: true

use_prev_data: false
prev_data_dir: null

dupe: false
editor: code
dump_runtime: false

hydra:
  run:
    dir: .main/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: .main/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
